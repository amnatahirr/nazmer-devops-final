name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # ================= FRONTEND =================
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      # ================= BACKEND =================
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      # (Optional test step)
      - name: Run Backend Tests
        working-directory: ./backend
        run: echo "No tests defined"

      # ================= DOCKER =================
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Backend Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/nazmer-backend ./backend

      - name: Build Frontend Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/nazmer-frontend ./frontend

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/nazmer-backend
          docker push ${{ secrets.DOCKER_USERNAME }}/nazmer-frontend