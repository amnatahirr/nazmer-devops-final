name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # ================= CHECKOUT =================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ================= NODE SETUP =================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ================= FRONTEND BUILD =================
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      # ================= BACKEND TEST =================
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Backend Tests
        working-directory: ./backend
        run: npm test || true   # prevents pipeline crash if no tests

      # ================= DOCKER BUILD =================
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Backend Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/nazmer-backend:latest ./backend

      - name: Build Frontend Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/nazmer-frontend:latest ./frontend

      - name: Push Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/nazmer-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/nazmer-frontend:latest

      # ================= AZURE LOGIN =================
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ================= GET AKS CREDENTIALS =================
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
          --resource-group nazmer-rg \
          --name nazmer-cluster \
          --overwrite-existing

      # ================= DEPLOY TO KUBERNETES =================
      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/